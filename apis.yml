aid: altscore
name: AltScore
description: >-
  AltScore is a B2B credit infrastructure platform for Latin America — the "Rails
  of Lending" that lets any company build, embed, and deploy credit products in
  weeks instead of years. Its API surface spans three products: AltData, an
  aggregation layer over 50+ alternative and traditional data sources for
  underwriting and scoring; Borrower Central, an onboarding, KYC/KYB, identity,
  document, and workflow/decisioning engine; and a Credit Management System for
  the full loan lifecycle — disbursements, credit accounts, debts, payment
  orders, and DPAs. Access is through first-party Python and TypeScript SDKs, a
  Go CLI, and a Frontegg-backed OAuth/OIDC identity layer, with a dedicated
  sandbox environment and an in-production test mode (isTest) for UAT.
