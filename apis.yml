apis:
- name: AltData API
  description: >-
    Alternative-data aggregation for credit underwriting and scoring. Aggregates
    over 50 data sources into on-demand data requests that feed borrower
    enrichment and decisioning.
  humanURL: https://docs.altscore.ai/
  baseURL: https://data.altscore.ai
  properties:
  - type: Documentation
    url: https://docs.altscore.ai/
- name: Borrower Central API
  description: >-
    Onboarding, KYC/KYB, identities, documents, deals, forms, workflows (v1 + v2),
    credit decisioning, evaluators, and policy rules. The default module of the
    AltScore SDK and CLI.
  humanURL: https://docs.altscore.ai/
  baseURL: https://bc.altscore.ai
  properties:
  - type: Documentation
    url: https://docs.altscore.ai/
- name: Credit Management System API
  description: >-
    The loan lifecycle system — partners, clients, credit accounts, debts,
    disbursements, disbursement accounts, payment accounts, payment orders, and
    DPAs (payment agreements). Includes the webhooks surface.
  humanURL: https://docs.altscore.ai/
